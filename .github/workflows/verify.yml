name: Verify game
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gg_test
          POSTGRES_PASSWORD: gg_ci_only
          POSTGRES_DB: gg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gg_test -d gg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GG_TEST_DB: '1'
      DATABASE_URL: postgresql://gg_test:gg_ci_only@localhost:5432/gg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: PGPASSWORD=gg_ci_only psql -h localhost -U gg_test -d gg_test -v ON_ERROR_STOP=1 -f test/ci-schema.sql
      - run: node --test test/pirate-v110.test.js
      - run: npm test
