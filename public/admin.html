<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD GAMING | Control</title><link rel="stylesheet" href="/style.css"></head><body class="admin-body"><main class="admin-wrap"><div class="eyebrow">ACCESO RESTRINGIDO / SECTOR 01</div><h1>GOLD <span>CONTROL</span></h1><p class="muted">Administración del servidor · <a href="/">Volver al hangar</a></p><section id="loginCard" class="admin-card"><h2>Autenticación</h2><form id="login"><label for="password">ADMIN_PASSWORD</label><input id="password" type="password" required autocomplete="current-password"><button>Acceder</button></form></section><p id="adminStatus" role="status"></p><div id="tools" hidden><section class="admin-card"><h2 id="summary">Jugadores conectados</h2><button id="refresh" class="small">Actualizar</button> <button id="logout" class="small">Cerrar sesión</button><div class="admin-table"><table><thead><tr><th>PILOTO</th><th>NAVE</th><th>CRÉDITOS</th><th>VIDA</th><th>COORDENADAS</th></tr></thead><tbody id="players"></tbody></table></div></section><div class="admin-grid"><section class="admin-card"><h2>Enviar créditos</h2><form id="creditForm"><label for="creditPlayer">Jugador</label><select id="creditPlayer" required></select><label for="amount">Monto (1 a 1.000.000)</label><input id="amount" type="number" min="1" max="1000000" step="1" required value="1000"><button>Enviar créditos</button></form></section><section class="admin-card"><h2>Generar Boss TITAN</h2><form id="bossForm"><label for="bossPlayer">Ubicación</label><select id="bossPlayer"></select><p class="muted">Aparece cerca del piloto elegido o en el centro del sector.</p><button>Generar jefe</button></form></section></div></div></main><script src="/admin.js" defer></script></body></html>
